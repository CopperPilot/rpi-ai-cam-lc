      - {layer: dielectric_3, kind: prepreg, material: "7628", thickness_mm: 0.19, epsilon_r: 4.69}
      - {layer: In3.Cu, role: power_plane, copper_mm: 0.0175, nets: ["+5V", "VBUS_IN", "+3V3"], notes: "L4 0.5 oz (0.0175 mm, 0.99 mOhm/sq at 25 C) power plane: dedicated VBUS_IN plane from J1 to U4.5/U5.5 (8 vias + F.Cu 1 oz parallel polygons), +5V main plane with 45 mm combined corridor width (9 mirror-symmetric vias at U4.6/U5.6 and 5 parallel +5V vias at J6 pads 77-87 -> dT < 2 C at 3-5 A), and +3V3 sub-zone; no high-speed pairs reference In3.Cu"}
