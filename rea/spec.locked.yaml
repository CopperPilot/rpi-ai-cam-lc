    - name: hdmi0_tmds
      nets: ["HDMI0_TX0_P", "HDMI0_TX0_N", "HDMI0_TX1_P", "HDMI0_TX1_N", "HDMI0_TX2_P", "HDMI0_TX2_N", "HDMI0_CLK_P", "HDMI0_CLK_N"]
      kind: diff_pairs
      tolerance_mm: 0.5
      diff_impedance_ohm: 100.0
      source: "CM5 Datasheet Section 3.8 & Lion SU-06L-0165-GDM140-001 6-layer stackup: HDMI 100 ohm differential microstrip on F.Cu/B.Cu over unbroken In1.Cu/In4.Cu 0.5 oz GND plane (0.190 mm 7628 prepreg, Dk=4.69; net class Diff100: width 0.180 mm / gap 0.1524 mm -> 101.3 ohm), intra-pair skew <= 0.5 mm"
    - name: csi0_mipi
      nets: ["MIPI0_D0_P", "MIPI0_D0_N", "MIPI0_D1_P", "MIPI0_D1_N", "MIPI0_C_P", "MIPI0_C_N"]
      kind: diff_pairs
      tolerance_mm: 0.5
      diff_impedance_ohm: 100.0
      source: "CM5 Datasheet Section 3.7 & Lion SU-06L-0165-GDM140-001 6-layer stackup: 2-lane MIPI0 CSI-2 100 ohm differential microstrip on B.Cu/F.Cu over unbroken In4.Cu/In1.Cu 0.5 oz GND plane (0.190 mm 7628 prepreg, Dk=4.69; net class Diff100: width 0.180 mm / gap 0.1524 mm -> 101.3 ohm), intra-pair skew <= 0.5 mm"
