requirements:
  - {id: R1, text: "Carrier board exactly the size of the CM5 (55 x 40 mm, 3.0 mm corner radius, four M2.5 holes 3.5 mm in, 6 layers, 1.6 mm, Custom tier with impedance control) fabricated and assembled by Lion Circuits", how_met: "55.0 x 40.0 mm 6-layer 1.6 mm PCB on fab.profile=lioncircuits (Custom tier with impedance control on Lion's published 6-layer 1.6 mm stack-up: F.Cu signal / In1.Cu GND / In2.Cu signal / In3.Cu +5V & +3V3 power / In4.Cu GND / B.Cu signal) with 3.0 mm corners, M2.5 corner mounting holes, 2-up assembly panelization, and 6-layer fab package/BOM/CPL; every soldered BOM part verified in stock in Lion's live catalogue", quantity: "55 x 40 x 1.6 mm, 6 layers"}
  - {id: R2, text: "Compute Module 5 (any eMMC variant such as CM5104016 or CM5104032, bought outside Lion Circuits and excluded from Lion BOM) plugged in underneath on two separate Amphenol 10164227-1001A1RLF 1.5 mm mezzanine footprints and four 1.5 mm Wurth 9774015960R spacers; nothing on bottom > 1.5 mm and no through-hole leads poking through; 8x15 mm copper/part keepout over CM5 Wi-Fi antenna across all six copper layers", how_met: "J6 and J7 placed as separate 10164227-1001A1RLF footprints on B.Cu alongside SP5..SP8 (9774015960R); all other components are SMD on F.Cu; cm5_wifi_antenna keepout (8x15 mm) on all six copper layers (F.Cu, In1.Cu, In2.Cu, In3.Cu, In4.Cu, B.Cu) at left board edge", quantity: "1.5 mm stack, 8 x 15 mm 6-layer antenna keepout"}
  - {id: R3, text: "USB-C power and rpiboot flashing on GCT USB4105-GF-A with low-drop (<=0.10 V carrier drop at 3 A, within 0.25 V total budget to 4.75 V) soft-started ideal-diode / OVP load switch isolating CM5 bulk capacitance (cSink <= 10 uF), CC1/CC2 to CM5 CC1/CC2, D+/D- to CM5 USB 2.0 OTG port, and ESD protection", how_met: "J1 (USB4105-GF-A) feeds VBUS_IN (with C1=2.2 uF 50 V X7R 0805 CL21B225KBYNNWE + C4=100 nF 50 V X7R 0402 = 2.3 uF nominal cSink <= 10 uF, both rated at 50 V >= 1.79x D4's 28.0 V max clamp, and TI TVS2200DRVR 22 V flat-clamp unidirectional WSON-6 surge TVS D4 on VBUS_IN tolerating 20 V USB-C faults with VRWM=22 V and clamping at 27.2 V typ / 27.7 V max at 24 A and 27.6 V typ / 28.0 V max at 40 A 8/20 us <= +28 V abs max and VF=-0.5 V typ) via wide F.Cu copper polygons, a dedicated 1 oz In3.Cu VBUS_IN plane, and 8 parallel VBUS_IN vias into two parallel TI TPS259470ARPWR active-current-limiting ideal-diode OVP eFuses (U4, U5; combined R_ON=14.15 mOhm typ / 21.0 mOhm max, ~2 mOhm PCB copper+via resistance with mirror-symmetric 9-via U4.6/U5.6 output arrays, 1 oz In3.Cu +5V plane, and 5 parallel +5V vias at J6 pads 77-87 -> ~48 mV typ / ~110 mV max carrier drop at 3 A, C22=4.7 nF soft-start isolating CM5 +5V bulk capacitance at hot-plug while U4.3 AUXOFF stages U5.1 EN/UVLO via R15=100k to VBUS_IN / R16=43k to GND and open-drain U5.3 AUXOFF + U4.4/U5.4 ~{FLT} on VBUS_AUXOFF feed J6.99 PMIC_Enable with R5=1.33k pull-up to +5V, D12 BAT54S dual series Schottky diode (1->3 fast charge, 3->2 rapid +5V collapse discharge), R19=6.8k, and C32=2.2 uF 25 V X7R 0603 (tau_fall>=10.7 ms > 3.94 ms t_ITIMER, tau_rise=2.42 ms, V_LOW=0.37 V) per TI Figure 8-18, C23=C24=4.7 nF steady-state ITIMER blanking capacitors setting t_ITIMER=3.94 ms, R12=390k / R13=49.9k / R14=107k setting UVLO_R=4.18 V and OVLO_R=6.13 V typ / 5.83 V min > 5.50 V vSafe5V disconnecting >6.1 V and 20 V faults, R17=R18=1.33 kOhm RC0402FR-071K33L setting ILIM(typ)=2.50 A per eFuse / 5.0 A combined <= J1 5.0 A rating and ILIM(min)=2.28 A supporting >=3.80 A > 3.62 A worst-case system load under 60%/40% passive sharing), routes J1 CC1/CC2 (C_CC1/C_CC2) through TI TPD6S300ARUKR 24 V-tolerant series CC1/CC2 OVP + IEC 61000-4-2 ESD + dead-battery Rd protection IC U6 (with C33=100 nF 50 V X7R on VBIAS, C34=1 uF on +3V3 VPWR, and R9=100k pull-up on ~{FLT}) to protected system-side CC1/CC2 (J6 pads 94/96 and secondary 5.5 V unidirectional TPD1E05U06DPYR clamps D5/D6, isolating CM5 and D5/D6 from 20 V VBUS-to-CC shorts), and wires D+/D- to USB2_P/N with USBLC6-2SC6 (D1, pin 5 on VBUS_D1_CLAMP decoupled to GND by C25=100 nF and DC-biased from +5V via R20=100 kOhm while isolated from VBUS_IN) ESD protection and USB_OTG_ID left unconnected so CM5 internal pull-up selects USB Device/rpiboot mode", quantity: "1x USB-C, 5 V / 3-5 A"}
  - {id: R4, text: "Two surface-mount horizontal USB 2.0 Type-A ports (Wurth 629104190121) on CM5 USB3-0 and USB3-1 USB 2.0 pairs with VBUS_EN current-limited power switches and ESD protection", how_met: "J2 and J3 (629104190121) on bottom edge wired to USB3-0-D_P/N and USB3-1-D_P/N, protected by USBLC6-2SC6 (D2, D3) and powered via AP2553W6-7 (U2, U3) with 43 kOhm ILIM resistors R1/R2 (0.56 A min / 0.615 A typ / 0.68 A max limit per port), 222 uF nominal / ~207.5 uF effective low-ESR output capacitance per port (two 100 uF 10 V 70 mOhm Kemet T520B107M010ATE070 KO-CAP polymer tantalum capacitors C26+C27 on USB0_VBUS and C28+C29 on USB1_VBUS plus 22 uF 10 V X5R 0603 MLCCs C2 and C3, >= 167.5 uF worst-case at -20% tolerance >= 120 uF per USB 2.0 Section 7.2.4.1 Table 7-7, charging in 1.69 ms typ / 1.85 ms at 0.56 A ILIM_min << 4-15 ms AP2553W6-7 t_Blank), 205.2 uF nominal / ~203.5 uF effective upstream +5V bulk reservoir (C30+C31 2x100 uF polymer tantalum + C9 2.2 uF + C10..C12 3x1 uF), 22 kOhm pull-down R10 on USB_VBUS_EN (U2.3), and 22 kOhm pull-down R11 to GND on U3.3 / CM5 GPIO26 (J6 pad 24, net USB1_VBUS_EN with zero capacitive loading) so USB-A port 1 defaults OFF in hardware during reset and boot (guaranteeing <= 2.935 A <= 3.0 A on 3.0 A non-PD sources) until software enables GPIO26", quantity: "2x USB-A 2.0"}
  - {id: R5, text: "Full-size HDMI port (Amphenol 10029449-111RLF) from CM5 HDMI0 through TPD12S016PWR", how_met: "J4 (10029449-111RLF) on right edge driven by CM5 HDMI0 TMDS pairs through U1 (TPD12S016PWR, with CT_HPD=+3V3 for 55 mA HDMI0_5V supply and HPD buffer, C8=1 uF reservoir on 5V_OUT, 8-channel TMDS ESD protection, and LS_OE=GND with A-side pins tied to +3V3 and B-side CEC_B/SCL_B/SDA_B pins 7-9 left open so neither U1's 27 kOhm CEC_B pull-up nor its 1.75 kOhm DDC pull-ups load the bus, while CM5 internal fail-safe 1.8 kOhm 5 V DDC pull-ups and 27 kOhm 3.3 V CEC pull-up drive HDMI0_SCL/HDMI0_SDA/HDMI0_CEC directly, protected at J4 by local 5.5 V unidirectional ultra-low-capacitance (0.42 pF typ) TPD1E05U06DPYR ESD TVS diodes D9, D10, and D11 to GND)", quantity: "1x HDMI Type-A"}
  - {id: R6, text: "AI Camera (SC1174, rea_hardware.parts.ai_camera with rot_deg=90) mounted on top via four Wurth 9774080243R M2x8.0 mm SMT spacers, two 0.5 mm M2 washers per spacer (underside at Z=10.6 mm), and Essentra 50M020040N003 M2x4 nylon screws (>=1.8 mm thread engagement), with enforced height zones (<=5.75 mm under socket strip, <=6.65 mm under camera body) and Amphenol SFW15R-1STE1LF 15-pin bottom-contact FFC socket under the camera wired to CM5 CAM0 via Wurth 686615050001 50 mm same-side FFC folded in a 180 deg U-turn", how_met: "SP1..SP4 (9774080243R, 8.0 mm) + m2_washers (2x0.5 mm = 1.0 mm) + camera_m2_screws (1.88 mm thread engagement) support ai_camera (rot_deg=90, centered at (20.431, -15.7)) with underside at Z=10.6 mm (9.0 mm above F.Cu); board.height_zones enforces 5.75 mm in camera_socket_strip and 6.65 mm in camera_body; J5 (SFW15R-1STE1LF, bottom contact, mouth +x, pin 1 at world +y) sits at (13.5, 15.7) wired to CM5 CAM0 (MIPI0 2-lane + CAM_GPIO0/1 + SCL0/SDA0) via 50 mm 686615050001 FFC with >=3.0 mm U-turn radius", quantity: "9.0 mm standoff (Z=10.6 mm underside), 5.75/6.65 mm height zones, 15-pin CAM0, 50 mm FFC"}
  - {id: R7, text: "Surface-mount power button on PWR_BUT, pinhole BOOT button on nRPIBOOT, UART0 test pads (GPIO14/GPIO15/GND), no GPIO header, and no SD slot", how_met: "SW1 (PTS526SM15SMTR2LFS) on PWR_BUT moved to (38.5, 27.6) clear of the FFC U-turn band, SW2 (B3U-1000P) behind pinhole on nRPIBOOT, SMD test pads TP1/TP2/TP3 on GPIO14/GPIO15/GND", quantity: "2 buttons, 3 test pads"}
  - {id: R8, text: "Two-part snap-fit FDM case (27.5 mm total depth, front shell to Z=+20.0 mm) with FOV-clearing front lens window, power button, BOOT pinhole, room for the 50 mm FFC U-turn, exact port cutouts, rear M2.5 heat-set inserts, and CM5 cooling vents", how_met: "front_shell and back_shell clip together via FDM snap fits, clearing the 66.3 x 52.3 deg +/- 3 deg camera FOV from Z=19.75 mm, capturing power_button and boot_pin, housing the 50 mm FFC U-turn without sharp edges, and securing CM5 + PCBA via m25_screws into m25_inserts", quantity: "2 shells + 2 button actuators, 27.5 mm depth"}
decisions:
  - question: "Power path and current budget from USB-C J1?"
    choice: "J1 VBUS connects to upstream net VBUS_IN (protected by TI TVS2200DRVR 22 V 1.12 kW flat-clamp unidirectional WSON-6 surge TVS D4 with LCSC C523793, VRWM=22 V tolerating continuous 20 V +/- 5% USB-C PD overvoltage faults without breakdown, VBR=24.6-27.6 V at 1 mA, VCLAMP=27.2 V typ / 27.7 V max at 24 A 8/20 us and 27.6 V typ / 28.0 V max at 40 A 8/20 us <= +28 V U4/U5 abs max, and VF=-0.5 V typ clamping negative inductive transient ringing on reversible USB-C J1, and decoupled by C1=2.2 uF 50 V X7R 0805 Samsung CL21B225KBYNNWE + C4=100 nF 50 V X7R 0402 = 2.3 uF nominal / 2.53 uF max at +10% tolerance <= 10 uF USB Type-C cSink limit, both rated at 50 V >= 1.79x D4's 28.0 V maximum clamping voltage) and feeds two parallel TI TPS259470ARPWR active-current-limiting ideal-diode OVP eFuses (U4 primary, U5 secondary in TI Datasheet Figure 8-18 active-standby parallel configuration, combined R_ON(typ) = 14.15 mOhm at 25 C / 21.0 mOhm max at 85 C, with wide F.Cu copper polygons, a dedicated 1 oz In3.Cu VBUS_IN plane, 8 VBUS_IN vias, mirror-symmetric 9-via U4.6/U5.6 output arrays, a 1 oz In3.Cu +5V plane, and 5 parallel +5V vias with 0.50 mm B.Cu bus bars at J6 pads 77-87 -> ~2 mOhm total PCB copper+via resistance and ~48 mV typ / ~110 mV max carrier drop at 3.0 A) driving downstream +5V to CM5 +5V pins (J6 pads 77, 79, 81, 83, 85, 87), U2/U3 (AP2553W6-7), and U1 (TPD12S016PWR); CM5 internal PMIC generates +3V3 (feeding J5 camera and GPIO_VREF) and +1V8. U4 soft-starts via C22=4.7 nF (0.43 V/ms, ~11.7 ms ramp) while U4 AUXOFF (U4.3) holds U5 EN/UVLO (U5.1, net VBUS_U5_EN) low until U4's HFET gate reaches full overdrive, after which R15=100 kOhm (referenced to upstream VBUS_IN) and R16=43 kOhm (GND) bias U5 EN/UVLO to 1.50 V at 5.0 V (setting V_IN(UVLO_R)=3.99 V and V_IN(UVLO_F)=3.66 V without sensitivity to downstream +5V droop), and open-drain U5.3 (AUXOFF), U4.4 (~{FLT}), and U5.4 (~{FLT}) on net VBUS_AUXOFF feed CM5 PMIC_Enable (J6 pad 99, net PMIC_ENABLE, pulled up to +5V via CM5's internal 100 kOhm resistor) through R19=6.8 kOhm (RC0402FR-076K8L), C32=2.2 uF (25 V X7R 0603 GRM188Z71E225KE43D to GND, C_eff >= 1.85 uF typ / 1.68 uF min at 5 V bias and -10% tolerance, setting tau_fall = 14.0 ms nominal / 10.7 ms worst-case derated > 2.7x t_ITIMER=3.94 ms so a 3.94 ms low pulse keeps PMIC_ENABLE >= 3.58 V >> 2.0 V VIH_min, and V_LOW=0.37 V < 0.40 V), external pull-up R5=1.33 kOhm (RC0402FR-071K33L from +5V to VBUS_AUXOFF), and dual series Schottky diode D12 (Rectron BAT54S, LCSC C408389: Diode 1 Pin 1->3 from VBUS_AUXOFF to PMIC_ENABLE providing fast charge tau_rise = 2.88 ms nominal / 2.42 ms effective so PMIC_ENABLE slews 0.4 V->2.0 V in 1.12 ms and recharges 4.4x faster than tau_fall without ratcheting while reverse-biasing when VBUS_AUXOFF is low, and Diode 2 Pin 3->2 from PMIC_ENABLE to +5V immediately discharging C32 into +5V so J6.99 is never back-driven on rapid +5V collapse) per TI Figure 8-18 ('To downstream enable'). Shared divider R12=390 kOhm / R13=49.9 kOhm (RC0402FR-0749K9L, LCSC C137969) / R14=107 kOhm (RC0402FR-07107KL, LCSC C138070) sets UVLO_R=4.18 V and OVLO_R=6.13 V typ (5.83 V min > 5.50 V USB-PD vSafe5V max, 6.45 V max; OVLO_F=5.62 V typ / 5.33 V min, disconnecting >6.1 V and 20 V USB-C faults), R17=R18=1.33 kOhm (RC0402FR-071K33L, LCSC C276261, >=750 Ohm UL2367) set ILIM(typ)=2.504 A per eFuse (5.00 A combined <= J1 5.0 A VBUS contact rating, ILIM(min)=2.281 A / 4.56 A combined, ILIM(max)=2.731 A) so neither eFuse reaches ILIM(min) under worst-case 60%/40% passive R_ON+PCB sharing up to 2.281 A / 0.60 = 3.80 A (> 3.62 A worst-case system fault load / 3.26 A nominal full load) and active current-limit regulation equalizes sharing up to 5.0 A, and C23=C24=4.7 nF on U4.10 and U5.10 (ITIMER) set steady-state transient overcurrent blanking t_ITIMER=3.94 ms after start-up. U2/U3 current limits use R1=R2=43 kOhm (0.56 A min / 0.615 A typ / 0.68 A max per USB-A port), USB0_VBUS and USB1_VBUS each have 222 uF nominal / ~207.5 uF effective low-ESR capacitance (two 100 uF 10 V 70 mOhm Kemet T520B107M010ATE070 KO-CAP polymer tantalum capacitors C26+C27 on USB0_VBUS and C28+C29 on USB1_VBUS with zero DC-bias derating, plus 22 uF 10 V X5R 0603 MLCC C2/C3 providing ~7.5 uF effective HF bypass at 5 V; >= 167.5 uF worst-case at -20% tolerance >= 120 uF per USB 2.0 Section 7.2.4.1 Table 7-7, charging to 5 V in 1.69 ms typ / 1.85 ms at 0.56 A ILIM_min << 4-15 ms AP2553W6-7 t_Blank without asserting FAULT_N) backed by 205.2 uF nominal / ~203.5 uF effective upstream +5V bulk capacitance (C30=100 uF and C31=100 uF T520B107M010ATE070 polymer tantalum + C9=2.2 uF + C10..C12=3x1 uF), USB_VBUS_EN (U2.3) is strapped low at boot with R10=22 kOhm, and U3.3 (USB1_VBUS_EN) is controlled independently by CM5 GPIO26 (J6 pad 24) with 22 kOhm off-state pull-down R11 to GND and zero capacitive loading (C21=100 nF reassigned to +5V HF bypass) so USB-A port 1 defaults OFF in hardware during reset and boot (guaranteeing <= 2.935 A <= 3.0 A on 3.0 A non-PD sources) until software enables GPIO26, D1 (USBLC6-2SC6 on USB2_P/N) has pin 5 (VBUS_D1_CLAMP) locally decoupled to GND by C25=100 nF and DC-biased from +5V through R20=100 kOhm (keeping D1's upper steering diodes reverse-biased at 5 V for 2.5 pF typ capacitance without peak-rectifying 3.3 V Full-Speed edges while limiting unpowered clamp current to <33 uA and isolating from 20 V on VBUS_IN), U6 (TI TPD6S300ARUKR, LCSC C2876380, WQFN-20) provides 24 V-tolerant series OVP FETs (V_OVP=6.0 V typ / 6.2 V max, 290 mOhm R_ON, 70 ns response), IEC 61000-4-2 ESD protection, and dead-battery 5.1 kOhm Rd pull-downs (C_CC1/RPD_G1 pins 4/7 on C_CC1 from J1.A5, C_CC2/RPD_G2 pins 5/6 on C_CC2 from J1.B5, VBIAS pin 3 decoupled by C33=100 nF 50 V X7R 0402 to GND, VPWR pin 10 powered from +3V3 with C34=1 uF 25 V X5R 0402 bypass, and ~{FLT} pin 9 pulled up to +3V3 via R9=100 kOhm) between J1.A5/B5 and protected system-side CC1/CC2 (U6 pins 12/11 to J6.94/96 and secondary 5.5 V unidirectional TPD1E05U06DPYR ESD clamps D5/D6 to GND), D7 uses 5.5 V unidirectional TPD1E05U06DPYR on PWR_BUT (5 V CM5 pull-up domain), and D8 uses 3.3 V PESD3V3S1BLYL on nRPIBOOT. On U1 (TPD12S016PWR), LS_OE (pin 5) is tied to GND and CT_HPD (pin 12) to +3V3 so the 55 mA HDMI0_5V load switch and HPD buffer remain enabled while the internal DDC/CEC level shifters are disabled; CEC_A/SCL_A/SDA_A (pins 1-3) are tied to +3V3 (<=3.6 V), C8=1 uF (GRM155R61E105KE11J) provides the TI-recommended 1 uF output reservoir on U1.13 (5V_OUT), CEC_B/SCL_B/SDA_B (pins 7-9) are left open (no-connect) so neither U1's internal 27 kOhm CEC_B pull-up nor its 1.75 kOhm DDC pull-ups contend with the CM5, and CM5's 5 V-tolerant fail-safe HDMI0_SCL/HDMI0_SDA (internal 1.8 kOhm pull-ups to +5V) and HDMI0_CEC (internal 27 kOhm pull-up to +3V3) drive J4 pins 15, 16, and 13 directly with local ultra-low-capacitance (0.42 pF typ) 5.5 V unidirectional TPD1E05U06DPYR ESD TVS diodes D9, D10, and D11 to GND at J4."
    reason: "Current budget: CM5 ~1.5-2.0 A + AI Camera ~0.20 A reflected to +5V (~0.25 A at +3V3) + HDMI 5V (0.055 A) + 2x USB-A 2.0 host ports (2 x 0.50 A nominal, 0.615 A typical / 0.68 A max limit per port via 43 kOhm R_ILIM on AP2553W6-7). Full simultaneous dual-USB-A load (3.26-3.62 A worst-case) operates within a 5 V / 5 A USB-PD contract negotiated natively by CM5 over CC1/CC2 (supported by U4 || U5 with R17=R18=1.33 kOhm giving ILIM(typ)=2.50 A per eFuse / 5.0 A combined <= J1 5.0 A VBUS contact rating and ILIM(min)=2.28 A supporting >=3.80 A > 3.62 A under worst-case 60%/40% passive R_ON+PCB sharing), while on a 5 V / 3.0 A non-PD source CM5 software can independently disable USB-A port 1 (J3/U3) by driving GPIO26 (J6 pad 24, USB1_VBUS_EN) low so hardware-limited peak current stays <=2.935 A <= 3.0 A. Isolating downstream +5V behind the soft-started parallel TPS259470ARPWR pair (with R15 referenced to VBUS_IN and open-drain U5.3 AUXOFF + U4.4/U5.4 ~{FLT} shaped by R5=1.33k + D12 BAT54S + R19=6.8k + C32=2.2 uF X7R to J6.99 PMIC_Enable per TI Figure 8-18) keeps unswitched cSink at J1 to 2.3 uF nominal (<= 10 uF USB Type-C limit), holds the CM5 PMIC in reset during soft-start and persistent >3.94 ms faults without false resets during <3.94 ms transient current limiting, limits carrier voltage drop at 3.0 A to ~48 mV typ / ~110 mV max (within the 0.25 V total budget to 4.75 V), blocks reverse current from +5V to VBUS_IN, and disconnects >6.1 V and 20 V USB-C overvoltage faults (with OVLO_R,min=5.83 V > 5.50 V USB-PD vSafe5V max) behind TI TVS2200DRVR 22 V flat-clamp unidirectional surge TVS D4."
  - question: "Flashing and boot-mode path for CM5?"
    choice: "USB2_P/USB2_N (J7 pads 5/3, CM5 pins 105/103) wired directly to USB-C J1 D+/D- with USB_OTG_ID (J7 pad 1, CM5 pin 101) left unconnected so CM5 internal pull-up selects USB Device / rpiboot mode; SW2 (Omron B3U-1000P) pulls nRPIBOOT (J6 pad 93, CM5 pin 93) directly to GND when held with a paperclip at power-up."
    reason: "Per CM5 Datasheet Section 3.4, leaving USB_OTG_ID unconnected selects USB Device mode for rpiboot flashing and USB gadget networking (whereas grounding USB_OTG_ID forces Host mode). Hardware switch SW2 holds nRPIBOOT at 0 V before USB-C VBUS is applied, guaranteeing nRPIBOOT is low well within the 2 ms window after 5 V rises. User USB-A ports J2/J3 use RP1 host pairs USB3-0-D_P/N and USB3-1-D_P/N, leaving the OTG pair dedicated to J1."
  - question: "How are the 6-layer stack-up, layer order, and controlled-impedance traces realized on Lion Circuits?"
    choice: "Upgrade the board from 4 layers to 6 layers, 1.6 mm, on Lion Circuits' published 6-layer 1.6 mm Custom-tier stack-up with impedance control: L1 F.Cu (signal, 0.035 mm) / 0.12 mm 2116*1 prepreg / L2 In1.Cu (unbroken GND plane, 0.035 mm) / 0.36 mm NP-140 core / L3 In2.Cu (slow signals, 0.035 mm) / 0.48 mm 2116*4 prepreg / L4 In3.Cu (+5V and +3V3 power planes, 0.035 mm) / 0.36 mm NP-140 core / L5 In4.Cu (unbroken GND plane, 0.035 mm) / 0.12 mm 2116*1 prepreg / L6 B.Cu (signal, 0.035 mm), with er=4.1. Update net classes for the 0.12 mm outer prepregs: Diff100 (100 ohm HDMI0 TMDS and 2-lane MIPI0 CSI-2) uses 0.1524 mm (6.0 mil) width and 0.18 mm (7.1 mil) gap (99.9 ohm differential; existing 0.1524 mm routes with 0.25-0.55 mm gap give 105.4-112.1 ohm, within 100 ohm +/- 15%); Diff90 (90 ohm USB2 OTG and USB3_0/USB3_1 USB 2.0 pairs) uses 0.175 mm (6.9 mil) width and 0.1524 mm (6.0 mil) gap (89.8 ohm differential; or 0.20 mm width if preserving 0.45-0.53 mm gap segments -> 95.3-95.8 ohm, within 90 ohm +/- 15%). Route the slow nets (HDMI0_HOTPLUG, HDMI0_CEC, HDMI0_SCL, HDMI0_SDA, CC1, CC2, CAM_GPIO0, CAM_GPIO1, SCL0, SDA0, PWR_BUT, UART0_RXD and their pull-ups) on In2.Cu while keeping existing component placement where the camera changes allow and preserving valid high-speed routes."
    reason: "Owner directive (3 Nov): on 4 layers only F.Cu and B.Cu carried signals while B.Cu was congested by J6/J7 and SP5..SP8, leaving 12 slow nets unrouted across three sessions. The 6-layer stack-up dedicates In1.Cu and In4.Cu as unbroken GND reference planes immediately adjacent to F.Cu and B.Cu so every high-speed differential pair runs next to an unbroken GND plane and never crosses a split on In3.Cu, while In2.Cu provides a clean inner routing plane for all slow control and I2C/CEC/CC signals."
  - question: "What are the keepout, requirement R1, and Lion Circuits fab/BOM/CPL updates for the 6-layer revision?"
    choice: "Expand the 8x15 mm CM5 antenna keepout (cm5_wifi_antenna, rect_mm [0.0, 14.0, 8.0, 29.0]) to all six copper layers [F.Cu, In1.Cu, In2.Cu, In3.Cu, In4.Cu, B.Cu], drop the old camera_socket_keepout 0 mm rule area, and update requirement R1, the fab package, and Lion BOM/CPL notes to 6 layers."
    reason: "Matches the CM5 datasheet requirement for zero copper on any layer beneath the PCB antenna and aligns R1 and the Lion Circuits 6-layer Custom-tier fabrication/assembly package with the owner's 3 Nov specification."
