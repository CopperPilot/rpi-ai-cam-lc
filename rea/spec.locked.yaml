schema_version: rea-hardware/spec/v1
product:
  slug: rpi-ai-cam-lc
  name: Compact CM5 AI Camera
  summary: "Compute Module 5 6-layer carrier board (55x40 mm) with 12MP AI Camera rotated 90 deg on 8 mm spacers, 50 mm fold-under 15-pin FFC on CAM0, USB-C PD/flashing, 2x USB-A 2.0, full-size HDMI, and snap-fit two-part FDM enclosure assembled by Lion Circuits"
  category: embedded camera
inputs:
  images:
    - inputs/ref-cm5-ai-cam-3d_top.jpg
    - inputs/ref-cm5-ai-cam-3d_bottom.jpg
    - inputs/ref-cm5-ai-cam-3d_iso.jpg
    - inputs/ai-camera-drawing.jpg
    - inputs/camera-module-3-drawing.jpg
    - inputs/camera-cable-200mm-drawing.jpg
  views:
    front: inputs/ref-cm5-ai-cam-3d_top.jpg
    rear: inputs/ref-cm5-ai-cam-3d_bottom.jpg
  prompt: inputs/prompt.md
envelope:
  width_mm: 59.0
  height_mm: 44.0
  depth_mm: 27.5
  corner_radius_mm: 5.0
  derivation: "55.0 x 40.0 mm CM5 carrier PCB (3.0 mm corner radius) enclosed by 2.0 mm FDM shell walls -> 59.0 x 44.0 mm plan view (5.0 mm outer corner radius). Depth spans Z=-7.5 mm (rear wall below CM5 module at Z=-5.02..0) to Z=+20.0 mm (front shell flush over AI Camera lens front at Z=+19.75 mm; 1.6 mm PCB + 8.0 mm M2 spacer + two 0.5 mm washers = 10.6 mm camera PCB underside + 9.15 mm camera front stack) -> 27.5 mm total depth."
  front_origin_world_mm: [-2.0, 2.0, 20.0]
fidelity:
  brand_marks_excluded:
    - sony
    - waveshare
    - arducam
  out_of_scope:
    - tripod mount thread
    - external Wi-Fi u.FL antenna
    - SD card slot
    - 40-pin GPIO expansion header
  dimensions:
    - {name: overall_width, kind: overall_width, value_mm: 59.0, tol_mm: 1.5, source: "55.0 mm CM5 PCB + 2 x 2.0 mm FDM shell walls"}
    - {name: overall_height, kind: overall_height, value_mm: 44.0, tol_mm: 1.5, source: "40.0 mm CM5 PCB + 2 x 2.0 mm FDM shell walls"}
    - {name: overall_depth, kind: overall_depth, value_mm: 27.5, tol_mm: 1.5, source: "Z=-7.5 mm rear shell to Z=+20.0 mm front shell over AI Camera lens at Z=+19.75 mm"}
    - {name: corner_radius, kind: corner_radius, value_mm: 5.0, tol_mm: 1.0, source: "3.0 mm PCB corner radius + 2.0 mm concentric FDM wall"}
  must_match:
    - {id: F1, name: camera lens window, kind: window, view: front, center_mm: [25.0, 17.7], size_mm: [8.0, 8.0], implement: case, source: photo, confidence: high, notes: "Round/conical opening centered over Ø5.75 mm AI Camera lens front at board (23.0, 15.7), world (23.0, -15.7, 19.75), clearing full 66.3 x 52.3 deg +/- 3 deg FOV (horizontal along y)"}
    - {id: F2, name: power button, kind: button, view: front, center_mm: [40.5, 29.6], size_mm: [4.5, 4.5], implement: pcb+case, source: photo, confidence: high, notes: "Momentary power button over SW1 on PWR_BUT at board (38.5, 27.6), moved below the y=7.7..23.7 mm 16 mm FFC U-turn band"}
    - {id: F3, name: boot pinhole, kind: button, view: front, center_mm: [6.5, 12.5], size_mm: [2.0, 2.0], implement: pcb+case, source: photo, confidence: high, notes: "Paperclip pinhole over SW2 on nRPIBOOT at board (4.5, 10.5)"}
    - {id: F4, name: USB-C power and flashing port, kind: port, view: right, center_mm: [13.5, 16.75], size_mm: [9.5, 3.8], implement: pcb+case, source: photo, confidence: high, notes: "Right-edge opening for J1 GCT USB4105-GF-A at board (51.5, 11.5)"}
    - {id: F5, name: HDMI port, kind: port, view: right, center_mm: [27.0, 15.3], size_mm: [15.5, 6.2], implement: pcb+case, source: photo, confidence: high, notes: "Right-edge opening for J4 Amphenol 10029449-111RLF at board (49.0, 25.0)"}
    - {id: F6, name: USB 2.0 Type-A host port 0, kind: port, view: bottom, center_mm: [18.0, 14.85], size_mm: [14.8, 7.2], implement: pcb+case, source: photo, confidence: high, notes: "Bottom-edge opening for J2 Wurth 629104190121 at board (16.0, 34.3)"}
    - {id: F7, name: USB 2.0 Type-A host port 1, kind: port, view: bottom, center_mm: [37.5, 14.85], size_mm: [14.8, 7.2], implement: pcb+case, source: photo, confidence: high, notes: "Bottom-edge opening for J3 Wurth 629104190121 at board (35.5, 34.3)"}
    - {id: F8, name: rear CM5 cooling vents, kind: other, view: rear, center_mm: [29.5, 22.0], size_mm: [36.0, 20.0], implement: case, source: photo, confidence: high, notes: "Ventilation slots in back_shell over CM5 module"}
fab:
  profile: lioncircuits
  tier: custom
  layers: 6
  thickness_mm: 1.6
  impedance_control: true
  stackup_name: "SU-06L-0165-GDM140-001"
  assembly_sides: [top, bottom]
  notes: "Lion Circuits Custom tier 6-layer 1.6 mm (1.65 mm finished) PCB with impedance control on Lion standard stack-up SU-06L-0165-GDM140-001 (GDM-140 laminate, Tg 140: Solder mask 0.020 mm Dk=3.8 / L1 F.Cu 1 oz 0.035 mm signal / Prepreg 7628 0.190 mm Dk=4.69 / L2 In1.Cu 0.5 oz 0.0175 mm unbroken GND / Core GDM-140 0.450 mm Dk=4.5 / L3 In2.Cu 0.5 oz 0.0175 mm signal / Prepreg 7628 0.190 mm Dk=4.69 / L4 In3.Cu 0.5 oz 0.0175 mm +5V, VBUS_IN & +3V3 power / Core GDM-140 0.450 mm Dk=4.5 / L5 In4.Cu 0.5 oz 0.0175 mm unbroken GND / Prepreg 7628 0.190 mm Dk=4.69 / L6 B.Cu 1 oz 0.035 mm signal / Solder mask 0.020 mm Dk=3.8). Controlled-impedance pairs: Diff100 (100 ohm +/-10% HDMI0 TMDS and 2-lane MIPI0 CSI-2) edge-coupled microstrip on L1 F.Cu (ref L2 In1.Cu GND) and L6 B.Cu (ref L5 In4.Cu GND) width 0.180 mm / gap 0.1524 mm (stripline on L3 In2.Cu ref L2/L4 width 0.160 mm / gap 0.1524 mm if used); Diff90 (90 ohm +/-10% USB 2.0 OTG USB2_P/N and host USB3_0_DP/DN, USB3_1_DP/DN) edge-coupled microstrip on L1 F.Cu (ref L2 In1.Cu GND) and L6 B.Cu (ref L5 In4.Cu GND) width 0.230 mm / gap 0.1524 mm (or 0.230 mm / 0.209 mm -> 96.2 ohm; stripline on L3 In2.Cu width 0.200 mm / gap 0.1524 mm if used). Order quantity: 10 bare PCBs and 6 assembled boards (PCBA) with Lion Circuits purchasing every soldered SMD component. Compute Module 5 (any eMMC variant such as CM5104016 or CM5104032) is procured outside Lion Circuits, excluded from the Lion BOM, and pressed into J6/J7 at final assembly."
electrical:
  mcu: "Compute Module 5 with eMMC (any eMMC variant such as CM5104016 or CM5104032, bought outside Lion Circuits and pressed into dual 100-pin Amphenol 10164227-1001A1RLF mezzanine sockets J6/J7 at final assembly)"
  power: "USB-C J1 (GCT USB4105-GF-A) 5 V input on VBUS_IN with TI TVS2200DRVR 22 V 1.12 kW flat-clamp unidirectional WSON-6 surge TVS (D4, LCSC C523793, VRWM=22 V tolerating continuous 20 V +/- 5% USB-C PD overvoltage faults without breakdown, VBR=24.6-27.6 V at 1 mA, VCLAMP=27.2 V typ / 27.7 V max at 24 A 8/20 us and 27.6 V typ / 28.0 V max at 40 A 8/20 us <= +28 V U4/U5 abs max, VF=-0.5 V typ clamping negative inductive transient ringing on reversible USB-C J1), C1=2.2 uF (50 V X7R 0805 Samsung CL21B225KBYNNWE, LCSC C6534398, rated at 50 V >= 1.79x D4's 28.0 V maximum clamping voltage), and C4=100 nF (50 V X7R 0402 GRM155R71H104KE14D) immediately adjacent to J1 VBUS pins (2.3 uF nominal / 2.53 uF max at +10% tolerance <= 10 uF USB Type-C cSink limit), routed via wide F.Cu copper polygons (>=1.3-2.0 mm), a dedicated 1 oz (0.035 mm) In3.Cu VBUS_IN plane, and 8 parallel VBUS_IN vias into both ends of two parallel TI TPS259470ARPWR 28.3 mOhm 5.5 A active-current-limiting ideal-diode / OVP eFuses (U4 primary, U5 secondary in TI Figure 8-18 active-standby parallel configuration; combined R_ON(typ) = 14.15 mOhm at 25 C / 21.0 mOhm max at 85 C, with mirror-symmetric 9-via U4.6/U5.6 output arrays, a 1 oz In3.Cu +5V plane with 45 mm combined corridor width, and 5 parallel +5V vias with 0.50 mm B.Cu bus bars at J6 pads 77-87 -> ~2 mOhm total PCB copper+via resistance and ~48 mV typ / ~110 mV max carrier drop at 3.0 A within the 0.25 V total budget to 4.75 V) to downstream +5V; U4 soft-starts via C22=4.7 nF (0.43 V/ms, ~11.7 ms ramp) to isolate CM5 internal PMIC capacitance and carrier +5V bulk reservoir (C30=100 uF and C31=100 uF 10 V Kemet T520B107M010ATE070 KO-CAP polymer tantalum + C9=2.2 uF + C10..C12=3x1.0 uF = 205.2 uF nominal / ~203.5 uF effective, adding only 86 mA during the 0.43 V/ms soft-start ramp) at hot-plug while U4 open-drain AUXOFF (U4.3) holds U5 EN/UVLO (U5.1, net VBUS_U5_EN) low until U4's HFET gate reaches full overdrive (then R15=100 kOhm referenced to upstream VBUS_IN and R16=43 kOhm to GND bias U5 EN/UVLO to 1.50 V at 5.0 V and set V_IN(UVLO_R)=3.99 V / V_IN(UVLO_F)=3.66 V without sensitivity to downstream +5V load droop) and open-drain U5.3 (AUXOFF), U4.4 (~{FLT}), and U5.4 (~{FLT}) on net VBUS_AUXOFF feed CM5 PMIC_Enable (J6 pad 99, net PMIC_ENABLE, pulled up to +5V via CM5's internal 100 kOhm resistor) through RC filter R19=6.8 kOhm (RC0402FR-076K8L) C32=2.2 uF (25 V X7R 0603 GRM188Z71E225KE43D to GND, C_eff >= 1.85 uF typ / 1.68 uF min at 5 V bias and -10% tolerance, setting tau_fall = (100 kOhm || 6.8 kOhm)*C32 = 14.0 ms nominal / 10.7 ms worst-case derated > 2.7x t_ITIMER=3.94 ms so a 3.94 ms low pulse keeps PMIC_ENABLE >= 3.58 V >> 2.0 V VIH_min, and V_LOW=0.37 V < 0.40 V VIL_max), external pull-up R5=1.33 kOhm (RC0402FR-071K33L from +5V to VBUS_AUXOFF), and dual series Schottky diode D12 (Rectron BAT54S, LCSC C408389: Diode 1 Pin 1->3 from VBUS_AUXOFF to PMIC_ENABLE providing fast charge tau_rise = 1.31 kOhm * C32 = 2.88 ms nominal / 2.42 ms effective so PMIC_ENABLE slews 0.4 V->2.0 V in 1.12 ms and recharges 4.4x faster than tau_fall without repetitive-transient ratcheting while reverse-biasing when VBUS_AUXOFF is low, and Diode 2 Pin 3->2 from PMIC_ENABLE to +5V immediately discharging C32 into +5V so J6.99 is never back-driven on rapid +5V collapse) per TI Figure 8-18 ('To downstream enable'); shared divider R12=390 kOhm (>=350 kOhm per TI TPS25947 datasheet) / R13=49.9 kOhm (RC0402FR-0749K9L, LCSC C137969) / R14=107 kOhm (RC0402FR-07107KL, LCSC C138070) sets UVLO_R=4.18 V (UVLO_F=3.83 V) and OVLO_R=6.13 V typ (5.83 V min > 5.50 V USB-PD vSafe5V max, 6.45 V max; OVLO_F=5.62 V typ / 5.33 V min, disconnecting >6.1 V and 20 V USB-C faults), R17=R18=1.33 kOhm (RC0402FR-071K33L, LCSC C276261, >=750 Ohm UL2367) set ILIM(typ)=2.504 A per eFuse (5.00 A combined <= J1 5.0 A VBUS contact rating, ILIM(min)=2.281 A / 4.56 A combined, ILIM(max)=2.731 A) so neither eFuse reaches ILIM(min) under worst-case 60%/40% passive R_ON+PCB sharing up to 2.281 A / 0.60 = 3.80 A (> 3.62 A worst-case system fault load / 3.26 A nominal full load) and active current-limit regulation equalizes sharing up to 5.0 A, and C23=C24=4.7 nF on U4.10 and U5.10 (ITIMER) set the steady-state transient overcurrent blanking window to t_ITIMER=3.94 ms after start-up; J1 CC1/CC2 (J1 pads A5/B5 on connector-side nets C_CC1/C_CC2) routed through TI TPD6S300ARUKR 24 V-tolerant USB Type-C series CC1/CC2 OVP + IEC 61000-4-2 ESD protection IC (U6, LCSC C2876380 in WQFN-20: C_CC1/RPD_G1 pins 4/7 on C_CC1 and C_CC2/RPD_G2 pins 5/6 on C_CC2 providing 24 V-tolerant dead-battery 5.1 kOhm Rd pull-downs before +3V3 rises, VBIAS pin 3 decoupled by C33=100 nF 50 V X7R 0402 GRM155R71H104KE14D on CC_VBIAS, VPWR pin 10 powered from +3V3 and locally decoupled by C34=1 uF 25 V X5R 0402 GRM155R61E105KE11J, open-drain ~{FLT} pin 9 pulled up to +3V3 via R9=100 kOhm RC0402FR-07100KL on CC_FLT_N, and low-R_ON 290 mOhm series OVP FETs with V_OVP=6.0 V typ / 6.2 V max and 70 ns response isolating the system side from 20 V VBUS-to-CC shorts at J1) to protected system-side CC1/CC2 (U6 pins 12/11 to CM5 J6 pads 94/96) with secondary system-side ultra-low-capacitance (0.42 pF typ) TI TPD1E05U06DPYR unidirectional 5.5 V ESD clamps (D5, D6 to GND); USB2_P/N protected by USBLC6-2SC6 (D1) whose pin 5 (VBUS_D1_CLAMP) is locally decoupled to GND by C25=100 nF (50 V X7R 0402) and DC-biased from switched +5V through R20=100 kOhm (RC0402FR-07100KL, keeping D1's upper steering diodes reverse-biased at 5 V for 2.5 pF typ capacitance without peak-rectifying 3.3 V Full-Speed edges while limiting unpowered clamp current to <33 uA when +5V=0 V and isolating from 20 V on VBUS_IN); PWR_BUT (J6 pad 92, internally pulled up to +5V via 10 kOhm on CM5) protected by 5.5 V unidirectional TPD1E05U06DPYR (D7), and nRPIBOOT (J6 pad 93, using CM5's internal 10 kOhm pull-up to +3V3 with no redundant external pull-up) protected by 3.3 V PESD3V3S1BLYL (D8); CM5 internal PMIC supplies +3V3 (routed from J6 pads 84/86 via a 0.50 mm B.Cu bus bar and dedicated +3V3 vias at (18.95, 34.50), (21.50, 34.00), and (22.10, 34.40) into In3.Cu PWR_3V3_ZONE, with GPIO_VREF on J6 pad 78 Kelvin-connected as a zero-current sense branch) and +1V8; USB_VBUS_EN (J7 pad 11, strapped low by 22 kOhm R10 during reset/rpiboot) controls USB-A port 0 switch U2 (AP2553W6-7 on J2) while CM5 GPIO26 (J6 pad 24, net USB1_VBUS_EN with 22 kOhm pull-down R11 to GND and zero capacitive loading) independently controls USB-A port 1 switch U3 (AP2553W6-7 on J3) so U3 defaults OFF in hardware during reset and boot (guaranteeing <= 2.935 A <= 3.0 A peak boot load on 3.0 A non-PD sources before software enables GPIO26), with 43 kOhm ILIM resistors R1/R2 (0.56 A min / 0.615 A typ / 0.68 A max limit per port) and 222 uF nominal / ~207.5 uF effective output capacitance per port (two 100 uF 10 V 70 mOhm Kemet T520B107M010ATE070 KO-CAP polymer tantalum capacitors C26+C27 on USB0_VBUS and C28+C29 on USB1_VBUS plus 22 uF 10 V X5R 0603 MLCCs C2 and C3); TPD12S016PWR (U1, with CT_HPD=+3V3, LS_OE=GND, C12=1 uF on VCC5V, and C8=1 uF on 5V_OUT per TI Section 8.2.1) supplies 55 mA current-limited 5 V and HPD/TMDS ESD protection to HDMI J4 while U1 pins 7-9 (CEC_B/SCL_B/SDA_B) are left open so U1's internal 27 kOhm CEC_B pull-up and 1.75 kOhm DDC pull-ups do not contend with the CM5's onboard 27 kOhm 3.3 V HDMI0_CEC pull-up and fail-safe 1.8 kOhm 5 V HDMI0_SCL/HDMI0_SDA pull-ups, and discrete ultra-low-capacitance (0.42 pF typ) 5.5 V unidirectional TPD1E05U06DPYR ESD protection diodes D9, D10, and D11 protect HDMI0_SCL, HDMI0_SDA, and HDMI0_CEC at J4 pins 15, 16, and 13 (keeping C_SOURCE << 50 pF and preserving HDMI 1.4b 27 kOhm +/- 5% CEC impedance)."
  blocks:
    - id: cm5_core
      purpose: "Compute Module 5 dual 100-pin mezzanine interface (J6 GPIO/Power pins 1-100 at y=37.0 mm fed by 5 parallel +5V vias and 0.50 mm B.Cu bus bars at J6 pads 77-87, J7 High-Speed pins 101-200 at y=3.0 mm), switched +5V bulk reservoir and decoupling (C30=100 uF and C31=100 uF 10 V Kemet T520B107M010ATE070 polymer tantalum + C9=2.2 uF + C10..C12=3x1.0 uF = 205.2 uF nominal / ~203.5 uF effective downstream of U4/U5 eFuses, isolated from J1 at hot-plug), +3V3 to GPIO_VREF strap, UART0 console test pads (GPIO14/GPIO15/GND), and 8x15 mm all-6-layer copper keepout under CM5 PCB antenna"
      key_parts: ["10164227-1001A1RLF", "9774015960R", "T520B107M010ATE070"]
      reference: "Compute Module 5 Datasheet & CM5 IO Board Reference Design"
    - id: usbc_power_boot
      purpose: "USB-C power and eMMC flashing port (J1 GCT USB4105-GF-A): VBUS to VBUS_IN with TI TVS2200DRVR 22 V flat-clamp unidirectional WSON-6 surge TVS (D4, LCSC C523793, VRWM=22 V for 20 V USB-C fault tolerance, VBR=24.6-27.6 V, VCLAMP=27.2 V typ / 27.7 V max at 24 A and 27.6 V typ / 28.0 V max at 40 A 8/20 us <= +28 V abs max, VF=-0.5 V typ), C1=2.2 uF 50 V X7R 0805 (Samsung CL21B225KBYNNWE, LCSC C6534398, 50 V >= 1.79x D4 28.0 V max clamp), and C4=100 nF 50 V X7R 0402 immediately adjacent to J1 VBUS pads (2.3 uF nominal <= 10 uF cSink limit), routed via wide F.Cu copper polygons, a dedicated 1 oz In3.Cu VBUS_IN plane, and 8 parallel VBUS_IN vias into parallel TI TPS259470ARPWR active-current-limiting ideal-diode OVP eFuses (U4, U5; combined R_ON=14.15 mOhm, mirror-symmetric 9-via +5V output arrays, C22=4.7 nF soft-start, C23=C24=4.7 nF steady-state ITIMER blanking capacitors setting t_ITIMER=3.94 ms, R12=390 kOhm / R13=49.9 kOhm / R14=107 kOhm UVLO_R=4.18 V & OVLO_R=6.13 V typ / 5.83 V min > 5.50 V vSafe5V divider, R15=100 kOhm to VBUS_IN / R16=43 kOhm to GND U4.3 AUXOFF -> U5.1 EN/UVLO staging (V_IN(UVLO_R)=3.99 V), open-drain U5.3 AUXOFF + U4.4/U5.4 ~{FLT} on VBUS_AUXOFF wired with R5=1.33 kOhm pull-up to +5V, D12 BAT54S dual series Schottky diode (1->3 fast charge, 3->2 rapid +5V collapse discharge), R19=6.8 kOhm, and C32=2.2 uF 25 V X7R 0603 (tau_fall>=10.7 ms > 3.94 ms t_ITIMER, tau_rise=2.42 ms, V_LOW=0.37 V) to J6 pad 99 PMIC_Enable on net PMIC_ENABLE per TI Figure 8-18, R17/R18=1.33 kOhm RC0402FR-071K33L setting ILIM(typ)=2.50 A per eFuse / 5.0 A combined <= J1 5.0 A rating and ILIM(min)=2.28 A supporting >=3.80 A > 3.62 A worst-case system load under 60%/40% passive sharing) to +5V; connector-side C_CC1/C_CC2 (J1 pads A5/B5) protected by TI TPD6S300ARUKR 24 V-tolerant series CC1/CC2 OVP + IEC 61000-4-2 ESD + dead-battery Rd protection IC (U6, LCSC C2876380: C_CC1/RPD_G1 pins 4/7 on C_CC1, C_CC2/RPD_G2 pins 5/6 on C_CC2, VBIAS pin 3 with C33=100 nF 50 V X7R 0402 on CC_VBIAS, VPWR pin 10 on +3V3 with C34=1 uF 25 V X5R 0402, ~{FLT} pin 9 pulled up to +3V3 via R9=100 kOhm on CC_FLT_N, and protected system-side CC1/CC2 outputs on pins 12/11 isolating J6 pads 94/96 and secondary 5.5 V unidirectional TPD1E05U06DPYR clamps D5/D6 from 20 V VBUS-to-CC shorts); D+/D- to CM5 USB2_P/N (pins 105/103, pads 5/3 of J7); USB_OTG_ID (pin 101, pad 1 of J7) left unconnected so CM5 internal pull-up selects USB Device/rpiboot mode; USBLC6-2SC6 ESD protection (D1, pin 5 on VBUS_D1_CLAMP locally decoupled to GND by C25=100 nF and DC-biased from +5V via R20=100 kOhm while isolated from VBUS_IN); SW1 on PWR_BUT (pin 92 of J6, 5 V CM5 pull-up domain) protected by 5.5 V TPD1E05U06DPYR (D7); and SW2 behind pinhole on nRPIBOOT (pin 93 of J6, 3.3 V domain via CM5 internal 10 kOhm pull-up) protected by 3.3 V PESD3V3S1BLYL (D8)"
      key_parts: ["USB4105-GF-A", "TPS259470ARPWR", "TPD6S300ARUKR", "CL21B225KBYNNWE", "BAT54S", "RC0402FR-071K33L", "RC0402FR-076K8L", "RC0402FR-0749K9L", "RC0402FR-07107KL", "USBLC6-2SC6", "TPD1E05U06DPYR", "PESD3V3S1BLYL", "TVS2200DRVR", "PTS526SM15SMTR2LFS", "B3U-1000P"]
      reference: "Compute Module 5 Datasheet Section 3.4 (USB Boot / rpiboot) & TI TPS25947 Datasheet Figure 8-18"
    - id: usba_host
      purpose: "Dual USB 2.0 Type-A host ports (J2, J3 Wurth 629104190121) wired to RP1 USB3-0-D_P/N (pins 134/136, pads 34/36 of J7) and USB3-1-D_P/N (pins 163/65, pads 63/65 of J7), each powered via an AP2553W6-7 current-limited switch (U2, U3) with 43 kOhm ILIM resistors R1/R2 (0.56 A min / 0.615 A typ / 0.68 A max limit per port; full dual-port 2x0.5 A load under peak CM5 compute is supported on 5 V / 5 A USB-PD, while on 5 V / 3.0 A non-PD sources U3.3 on USB1_VBUS_EN is routed to CM5 GPIO26 on J6 pad 24 for independent software port shedding so total hardware-limited peak load is <=2.935 A <= 3.0 A), 222 uF nominal / ~207.5 uF effective low-ESR output bulk+bypass capacitance per port (two 100 uF 10 V 70 mOhm Kemet T520B107M010ATE070 KO-CAP polymer tantalum capacitors C26+C27 on USB0_VBUS and C28+C29 on USB1_VBUS with zero DC-bias derating, plus 22 uF 10 V X5R 0603 MLCC C2 on USB0_VBUS and C3 on USB1_VBUS; >= 167.5 uF worst-case at -20% tolerance >= 120 uF per USB 2.0 Section 7.2.4.1 Table 7-7, charging to 5 V in 1.69 ms typ / 1.85 ms at 0.56 A ILIM_min << 4-15 ms AP2553W6-7 t_Blank), 22 kOhm off-state pull-down R10 on USB_VBUS_EN (pin 111, pad 11 of J7), 22 kOhm off-state pull-down R11 to GND on U3.3 / J6.24 GPIO26 (USB1_VBUS_EN, with zero capacitive load on GPIO26 so U3 defaults OFF in hardware during boot until software enables Port 1), and USBLC6-2SC6 ESD protection"
      key_parts: ["629104190121", "AP2553W6-7", "RC0402FR-0743KL", "RC0402FR-0722KL", "T520B107M010ATE070", "CL10A226MO7JZNC", "USBLC6-2SC6"]
      reference: "Compute Module 5 IO Board USB 2.0 Host Reference"
    - id: hdmi0_out
      purpose: "Full-size HDMI 0 receptacle (J4 Amphenol 10029449-111RLF) driven by CM5 HDMI0 TMDS lanes (J7 pads 70/72, 76/78, 82/84, 88/90; CM5 pins 170/172, 176/178, 182/184, 188/190) with TPD12S016PWR companion IC (U1: CT_HPD=+3V3 to enable the 55 mA current-limited HDMI0_5V load switch and glitch-filtered HPD_B->HPD_A hotplug buffer, 8-channel matched TMDS ESD protection, and LS_OE=GND to disable the internal DDC/CEC level shifters with C8=1 uF reservoir on 5V_OUT and LS_OE=GND to disable the internal DDC/CEC level shifters while CEC_A/SCL_A/SDA_A are biased at VCCA=+3V3 <= 3.6 V and CEC_B/SCL_B/SDA_B (pins 7-9) are left open so neither U1's internal 27 kOhm CEC_B pull-up nor its 1.75 kOhm DDC pull-ups load the bus; CM5 5 V-tolerant fail-safe open-drain HDMI0_SCL/HDMI0_SDA (internal 1.8 kOhm pull-ups to +5V on J7 pads 100/99) and HDMI0_CEC (internal 27 kOhm pull-up to +3V3 on J7 pad 51) connect directly to J4 pins 15, 16, and 13 and are protected at J4 by local ultra-low-capacitance (0.42 pF typ) 5.5 V unidirectional TPD1E05U06DPYR ESD TVS diodes D9, D10, and D11 to GND, keeping C_SOURCE << 50 pF and preserving the single 27 kOhm +/- 5% HDMI 1.4b CEC pull-up impedance)"
      key_parts: ["10029449-111RLF", "TPD12S016PWR", "TPD1E05U06DPYR"]
      reference: "TI TPD12S016 Datasheet Table 1 & CM5 Datasheet Section 2.5.1 / Table 1 (Pins 151, 153, 199, 200)"
    - id: camera_csi0
      purpose: "15-pin 1.0 mm right-angle bottom-contact FFC camera socket (J5 Amphenol SFW15R-1STE1LF, LCSC C3168538) placed under the camera with mouth facing +x and pin 1 at the world +y end (board top side, y=8.7 mm, matching camera pin 1), wired with the standard 15-pin 2-lane CSI-2 pinout on CM5 camera port 0 (1 GND, 2 MIPI0_D0_N, 3 MIPI0_D0_P, 4 GND, 5 MIPI0_D1_N, 6 MIPI0_D1_P, 7 GND, 8 MIPI0_C_N, 9 MIPI0_C_P, 10 GND, 11 CAM_GPIO0 with 100 kOhm pull-down R8, 12 CAM_GPIO1 direct with no external pull-down so CM5 internal 15 kOhm pull-up to +3V3 is uncontested, 13 SCL0, 14 SDA0, 15 +3V3; no external pull-ups on SCL0/SDA0 since CM5 and AI Camera include onboard pull-ups), plus four Wurth 9774080243R M2x8.0 mm SMT spacers"
      key_parts: ["SFW15R-1STE1LF", "9774080243R"]
      reference: "CM5 IO Board CAM/DISP 0 Reference & Raspberry Pi AI Camera Product Brief p.4"
  nets_must_connect:
    - ["J1.A4", "VBUS_IN"]
    - ["U4.5", "VBUS_IN"]
    - ["U4.6", "+5V"]
    - ["U5.5", "VBUS_IN"]
    - ["U5.6", "+5V"]
