enclosure:
  process: fdm
  wall_mm: 2.0
  clearance_floor_mm: 0.2
  pair_floors_mm:
    "ai_camera:pcba": 0.5
  parts:
    - {id: back_shell, file: case/out/back_shell.stl, role: shell, process: fdm, material: PLA, finish: as-printed, color: "#2b2e34", description: "Rear FDM half with four M2.5 heat-set insert bosses, ventilation slots over CM5, and snap-fit catches"}
    - {id: front_shell, file: case/out/front_shell.stl, role: shell, process: fdm, material: PLA, finish: as-printed, color: "#363a42", description: "Front FDM half (extended to Z=+20.0 mm) with FOV-clearing camera lens window, relocated power button bezel, BOOT pinhole, smooth clearance for 50 mm FFC U-turn, port cutouts, and snap-fit hooks"}
    - {id: power_button, file: case/out/power_button.stl, role: button, process: fdm, material: PLA, finish: as-printed, color: "#d94f2b", description: "Captive front push button cap actuating SW1 at board (38.5, 27.6)"}
    - {id: boot_pin, file: case/out/boot_pin.stl, role: button, process: fdm, material: PLA, finish: as-printed, color: "#7c828d", description: "Recessed pinhole plunger over SW2 for paperclip rpiboot actuation"}
assembly:
  - {part: front_shell, travel_mm: 0, held_by: base, note: "Front enclosure shell inverted on assembly fixture (first-article sub-assembly: plug 50 mm 686615050001 FFC into camera J_CAM first, close J5's latch with camera lifted, fold 180 deg U-turn and screw camera down onto all four spacers without rocking; before first power, check with a meter that J5 pin 15 (+3V3) reaches camera pin 15 and J5 pin 1 reaches camera pin 1)"}
  - {part: power_button, direction: [0, 0, 1], travel_mm: 25, held_by: captured, may_touch: [front_shell], note: "Captive power button cap seated into front_shell bore at (38.5, -27.6)"}
  - {part: boot_pin, direction: [0, 0, 1], travel_mm: 25, held_by: captured, may_touch: [front_shell], note: "Captive boot pinhole plunger seated into front_shell pinhole"}
  - {part: camera_m2_screws, direction: [0, 0, 1], travel_mm: 30, held_by: captured, may_touch: [front_shell], note: "Four M2x4 nylon screws positioned for AI Camera mounting (1.88 mm thread engagement in SP1..SP4)"}
  - {part: ai_camera, direction: [0, 0, 1], travel_mm: 35, held_by: captured, may_touch: [front_shell, camera_m2_screws], note: "AI Camera (rot_deg=90) seated over M2 screws with lens barrel aligned in front window"}
  - {part: m2_washers, direction: [0, 0, 1], travel_mm: 35, held_by: captured, may_touch: [ai_camera, camera_m2_screws], note: "Eight 0.5 mm flat M2 washers (two per spacer, 1.0 mm stack) placed on M2 screw shanks against AI Camera"}
  - {part: m25_screws, direction: [0, 0, 1], travel_mm: 40, held_by: captured, may_touch: [front_shell], note: "Four M2.5x8 machine screws positioned in corner counterbores"}
  - {part: pcba, direction: [0, 0, 1], travel_mm: 40, held_by: captured, may_touch: [front_shell, m25_screws, m2_washers, camera_m2_screws, power_button, boot_pin], note: "Carrier PCBA seated onto 8.0 mm camera spacers SP1..SP4, buttons, and corner screw shanks"}
  - {part: cm5, direction: [0, 0, 1], travel_mm: 45, held_by: captured, may_touch: [pcba, m25_screws], note: "Compute Module 5 (any eMMC variant such as CM5104016 or CM5104032, bought outside Lion Circuits and excluded from Lion BOM) pressed onto J6/J7 and SP5..SP8 at final assembly"}
  - {part: m25_inserts, direction: [0, 0, 1], travel_mm: 45, held_by: captured, may_touch: [cm5, m25_screws], note: "Four M2.5 heat-set inserts engaged on M2.5 screw shanks"}
