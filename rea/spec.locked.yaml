  high_speed:
    - name: usb2_otg
      nets: ["USB2_P", "USB2_N"]
      kind: diff_pairs
      tolerance_mm: 1.0
      diff_impedance_ohm: 90.0
      source: "CM5 Datasheet Section 3.4 & Lion SU-06L-0165-GDM140-001 6-layer stackup: USB 2.0 90 ohm differential microstrip on B.Cu/F.Cu over unbroken In4.Cu/In1.Cu 0.5 oz GND plane (0.190 mm 7628 prepreg, Dk=4.69; net class Diff90: width 0.230 mm / gap 0.1524 mm -> 90.2 ohm), intra-pair skew <= 1.0 mm"
    - name: usb2_host0
      nets: ["USB3_0_DP", "USB3_0_DN"]
      kind: diff_pairs
      tolerance_mm: 1.0
      diff_impedance_ohm: 90.0
      source: "CM5 Datasheet Section 3.5 & Lion SU-06L-0165-GDM140-001 6-layer stackup: RP1 USB 2.0 host 0 90 ohm differential microstrip on F.Cu/B.Cu over unbroken In1.Cu/In4.Cu 0.5 oz GND plane (0.190 mm 7628 prepreg, Dk=4.69; net class Diff90: width 0.230 mm / gap 0.1524 mm -> 90.2 ohm), intra-pair skew <= 1.0 mm"
