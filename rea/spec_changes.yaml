requirements: "Updated R1..R8 for 6-layer board, rotated camera on 8 mm spacers + two washers, 15-pin CAM0 socket J5, 50 mm fold-under FFC, parallel TPS259470ARPWR VBUS_IN -> +5V ideal-diode OVP soft-start stage (2.3 uF cSink, 14.15 mOhm R_ON, 5.72 V OVLO, 1.00 kOhm R17/R18 RC0402FR-071KL for ILIM(typ)=3.33 A / ILIM(min)=3.03 A per eFuse and >=5.05 A passive current sharing), U1 TPD12S016PWR with LS_OE=GND, C8=1 uF on 5V_OUT, CEC_B/SCL_B/SDA_B open, and direct CM5 DDC/CEC routing protected by D9/D10/D11 (TPD1E05U06DPYR), 43 kOhm USB-A current limiters R1/R2, staggered U2/U3 turn-on, unidirectional CC1/CC2 and PWR_BUT ESD diodes D5/D6/D7, and open USB_OTG_ID"
decisions: "Recorded owner-mandated 3 Nov decisions and design-review fixes for R9 removal on CAM_GPIO1, 5 V PESD5V0S1UL,315 on PWR_BUT (D7), parallel TPS259470ARPWR eFuses (U4/U5) isolating CM5 bulk capacitance (2.3 uF cSink <= 10 uF) and disconnecting >5.8 V faults with R17=R18=1.00 kOhm RC0402FR-071KL (ILIM(typ)=3.33 A / ILIM(min)=3.03 A per eFuse supporting >=5.05 A under 60%/40% passive R_ON+PCB sharing) and R16=43 kOhm (V_+5V(UVLO_R)=3.99 V), U1 TPD12S016PWR LS_OE=GND with C8=1 uF on 5V_OUT and CEC_B/SCL_B/SDA_B (pins 7-9) open so CM5 internal 1.8 kOhm 5 V DDC pull-ups and 27 kOhm 3.3 V CEC pull-up drive J4 directly with D9/D10/D11 TPD1E05U06DPYR ESD protection, D1 pin 5 referenced to VBUS_IN, 43 kOhm R1/R2 USB-A ILIM, unidirectional PESD5V0S1UL,315 on CC1/CC2, D4 adjacent to J1 VBUS, R10 pull-down and R11/C21 RC stagger on U2/U3 EN, and open USB_OTG_ID"
