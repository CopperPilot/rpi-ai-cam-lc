envelope: "Front shell depth increased by 5.5 mm to Z=+20.0 mm (total depth 27.5 mm) to enclose AI Camera on 8.0 mm spacers + two 0.5 mm washers (lens front at Z=+19.75 mm)"
fidelity: "Updated overall_depth to 27.5 mm, F1 lens window to [25.0, 17.7] for rotated camera (rot_deg=90), F2 power button to [40.5, 29.6] clear of 16 mm FFC U-turn band, and side port Z-center coordinates for 20.0 mm front origin"
electrical: "Switched J5 camera interface to 15-pin 1.0 mm SFW15R-1STE1LF on CM5 camera port 0 on 6-layer stack-up; removed R9 (100 kOhm pull-down on CAM_GPIO1) so it does not fight the CM5 internal 15 kOhm pull-up to +3V3; replaced D4 on VBUS_IN with TI TVS2200DRVR 22 V flat-clamp unidirectional WSON-6 surge TVS (C523793, VRWM=22 V tolerating continuous 20 V +/- 5% USB-C overvoltage faults without breakdown, VBR=24.6-27.6 V, VCLAMP=27.2 V typ / 27.7 V max at 24 A and 27.6 V typ / 28.0 V max at 40 A 8/20 us <= +28 V U4/U5 abs max, VF=-0.5 V typ); replaced D5/D6 on CC1/CC2, D7 on PWR_BUT, and D9/D10/D11 on HDMI0_SCL/HDMI0_SDA/HDMI0_CEC at J4 with TI TPD1E05U06DPYR 5.5 V unidirectional ultra-low-capacitance (0.42 pF typ / 0.50 pF max) X1SON-2 ESD protection diodes (C436349, keeping HDMI DDC C_SOURCE << 50 pF per HDMI 1.4b Section 6.2, preserving 27 kOhm +/- 5% CEC impedance, and eliminating 152-200 pF CC1/CC2 loading); placed two parallel TI TPS259470ARPWR active-current-limiting ideal-diode OVP eFuses (U4, U5; combined R_ON=14.15 mOhm < 15 mOhm, C22=4.7 nF soft-start, C23=C24=4.7 nF steady-state ITIMER blanking capacitors setting t_ITIMER=3.94 ms, R12=390 kOhm / R13=49.9 kOhm / R14=107 kOhm UVLO_R=4.18 V & OVLO_R=6.13 V typ / 5.83 V min > 5.50 V vSafe5V divider, R15=100 kOhm referenced to upstream VBUS_IN / R16=43 kOhm U4.3 AUXOFF -> U5.1 EN/UVLO staging setting V_IN(UVLO_R)=3.99 V, open-drain U5.3 AUXOFF + U4.4/U5.4 ~{FLT} on VBUS_AUXOFF wired with R5=1.33 kOhm pull-up to +5V, D12 BAT54S dual series Schottky diode (1->3 fast charge, 3->2 rapid +5V collapse discharge), R19=6.8 kOhm, and C32=2.2 uF 25 V X7R 0603 (tau_fall>=10.7 ms > 3.94 ms t_ITIMER, tau_rise=2.42 ms, V_LOW=0.37 V) to J6 pad 99 PMIC_Enable on net PMIC_ENABLE per TI Figure 8-18, R17/R18=1.33 kOhm RC0402FR-071K33L C276261 setting ILIM(typ)=2.50 A per eFuse / 5.0 A combined <= J1 5.0 A rating and ILIM(min)=2.28 A supporting >=3.80 A > 3.62 A worst-case system load under 60%/40% passive sharing) between VBUS_IN (J1/D4/C1=2.2 uF 50 V X7R 0805 CL21B225KBYNNWE C6534398 rated >=1.79x D4 28.0 V max clamp/C4=100 nF 50 V X7R, 2.3 uF nominal <= 10 uF cSink) and downstream +5V; inserted TI TPD6S300ARUKR 24 V-tolerant USB Type-C series CC1/CC2 OVP + IEC 61000-4-2 ESD + dead-battery Rd IC U6 (C2876380, with C_CC1/RPD_G1 on J1.A5 C_CC1, C_CC2/RPD_G2 on J1.B5 C_CC2, C33=100 nF 50 V X7R on VBIAS, C34=1 uF GRM155R61E105KE11J on +3V3 VPWR, and R9=100 kOhm pull-up on ~{FLT}) ahead of system-side CC1/CC2 (J6.94/96 and D5/D6), routed via wide F.Cu copper polygons, a 0.5 oz In3.Cu VBUS_IN plane, 8 VBUS_IN vias, mirror-symmetric 9-via U4.6/U5.6 output arrays, a 0.5 oz In3.Cu +5V plane, and 5 parallel +5V vias with 0.50 mm B.Cu bus bars at J6 pads 77-87; locally decoupled D1 pin 5 (VBUS_D1_CLAMP) to GND via C25=100 nF and DC-biased from +5V via R20=100 kOhm; upgraded C8 on U1.13 5V_OUT (HDMI0_5V) to 1 uF (GRM155R61E105KE11J, C77009) per TI TPD12S016 Section 8.2.1; tied U1 (TPD12S016PWR) pin 5 (LS_OE) to GND and isolated/biased CEC_A/SCL_A/SDA_A (pins 1-3) to +3V3 (<= 3.6 V) and CEC_B/SCL_B/SDA_B (pins 7-9) as no-connect (eliminating U1.7's internal 27 kOhm pull-up contention) while routing CM5 5 V-tolerant HDMI0_SCL/HDMI0_SDA (internal 1.8 kOhm pull-ups to +5V) and HDMI0_CEC (internal 27 kOhm pull-up to +3V3) directly to J4 pins 15, 16, and 13 protected by D9, D10, and D11; added six 100 uF 10 V 70 mOhm Kemet T520B107M010ATE070 KO-CAP polymer tantalum bulk capacitors (C26+C27 on USB0_VBUS, C28+C29 on USB1_VBUS, and C30+C31 on switched +5V) alongside 22 uF 0603 MLCCs C2/C3 (CL10A226MO7JZNC / CL10A226MP8NUNE) so each USB 2.0 Type-A host port has 222 uF nominal / ~207.5 uF effective capacitance (>= 167.5 uF at -20% tolerance >= 120 uF per USB 2.0 Section 7.2.4.1 Table 7-7, charging in 1.69 ms typ << 7 ms AP2553W6-7 t_Blank) and switched +5V has 205.2 uF nominal / ~203.5 uF effective bulk storage; updated R1/R2 to 43 kOhm (~0.615 A typ per USB-A port), R6/R7/R10/R11 to 22 kOhm (RC0402FR-0722KL), and aligned J6/J7 roles and open USB_OTG_ID with hardware"
electrical.nets_must_connect: "Updated J1.A4 net from +5V to VBUS_IN, added U4.5/U5.5 (VBUS_IN) and U4.6/U5.6 (+5V) across the parallel TPS259470ARPWR eFuse stage, connected open-drain U5.3 (AUXOFF) and U4.4/U5.4 (~{FLT}) on VBUS_AUXOFF through R19/C32 to J6.99 (PMIC_Enable) on net PMIC_ENABLE per TI Figure 8-18, connected J6.24 (GPIO26) to U3.3 (USB1_VBUS_EN), and updated J1.A5/J1.B5 to C_CC1/C_CC2 through U6 (TPD6S300ARUKR pins 4/7->12 and 5/6->11) to protected system-side CC1/CC2 on J6.94/J6.96"
board: "Updated camera spacers SP1..SP4 to 8.0 mm 9774080243R at rotated camera holes, placed J5 (SFW15R-1STE1LF) under camera at (13.5, 15.7), moved SW1 to (38.5, 27.3), updated height zones to 5.75 mm / 6.65 mm, aligned J6 (GPIO/Power at y=37.0 mm) and J7 (High-Speed at y=3.0 mm) role descriptions, and updated stackup to Lion Circuits SU-06L-0165-GDM140-001 (1 oz 0.035 mm outer, 0.5 oz 0.0175 mm inner, 0.190 mm 7628 prepreg Dk=4.69, 0.450 mm GDM-140 core Dk=4.5, Diff90 0.230/0.1524 mm, Diff100 0.180/0.1524 mm)"
board.stackup: "Updated 6-layer stack-up to Lion Circuits SU-06L-0165-GDM140-001 (1 oz 0.035 mm outer, 0.5 oz 0.0175 mm inner, 0.190 mm 7628 prepreg Dk=4.69, 0.450 mm GDM-140 core Dk=4.5) and added a dedicated VBUS_IN plane on In3.Cu alongside +5V and +3V3"
bom: "Removed R9 (100 kOhm pull-down on CAM_GPIO1) and old MLCC array C13..C18; added six 100 uF 10 V 70 mOhm Kemet T520B107M010ATE070 Case B (3528-21) KO-CAP polymer tantalum bulk capacitors (C600583: C26+C27 on USB0_VBUS, C28+C29 on USB1_VBUS, and C30+C31 on switched +5V) alongside 22 uF X5R 0603 MLCCs C2, C3, and C19 (CL10A226MO7JZNC / CL10A226MP8NUNE, C84419) so each USB-A host port has ~207.5 uF effective bulk+HF capacitance (>= 120 uF USB 2.0 Section 7.2.4.1 C_PB) and +5V has ~203.5 uF effective bulk storage; updated C8, C10..C12, and C34 to 1 uF 25 V X5R 0402 Murata GRM155R61E105KE11J (C77009) and R6/R7/R10/R11 to 22 kOhm 1% 0402 Yageo RC0402FR-0722KL (C82868); replaced D4 on VBUS_IN with TI TVS2200DRVR 22 V flat-clamp unidirectional WSON-6 surge TVS (C523793); replaced D5/D6 (CC1/CC2), D7 (PWR_BUT), and D9/D10/D11 (HDMI0_SCL/HDMI0_SDA/HDMI0_CEC at J4) with TI TPD1E05U06DPYR 5.5 V unidirectional ultra-low-capacitance (0.42 pF typ / 0.50 pF max) X1SON-2 ESD protection diodes (C436349) and added D8 (PESD3V3S1BLYL, C552521) on nRPIBOOT; added parallel eFuses U4/U5 (TPS259470ARPWR, C3662799), UVLO/OVLO divider R12 (390 kOhm RC0402FR-07390KL, C163467) / R13 (49.9 kOhm RC0402FR-0749K9L, C137969) / R14 (107 kOhm RC0402FR-07107KL, C138070 setting UVLO_R=4.18 V and OVLO_R=6.13 V typ / 5.83 V min > 5.50 V vSafe5V), AUXOFF divider R15 (100 kOhm RC0402FR-07100KL, C60491 to VBUS_IN) / R16 (43 kOhm RC0402FR-0743KL, C185415 setting V_IN(UVLO_R)=3.99 V), ILIM resistors R5/R17/R18 (1.33 kOhm RC0402FR-071K33L, C276261), PMIC_ENABLE RC blanking filter R19 (6.8 kOhm RC0402FR-076K8L, C93940), D12 (BAT54S, C408389), and C32 (2.2 uF GRM188Z71E225KE43D, C415535), soft-start capacitor C22 and ITIMER blanking capacitors C23/C24 (4.7 nF GRM155R71H472KA01D, C77024), and D1 pin 5 clamp bypass C25 (100 nF GRM155R71H104KE14D, C77020) plus +5V DC bias resistor R20 (100 kOhm RC0402FR-07100KL, C60491); replaced J5 with Amphenol SFW15R-1STE1LF (C3168538) and SP1..SP4 with Wurth 9774080243R (C7495116); updated R1/R2 to RC0402FR-0743KL (43 kOhm, C185415), upgraded C1 on VBUS_IN to 2.2 uF 50 V X7R 0805 Samsung CL21B225KBYNNWE (C6534398, exceeding D4 28.0 V max clamp) while keeping C9/C32 as 2.2 uF 25 V X7R 0603 GRM188Z71E225KE43D (C415535), added U6 (TI TPD6S300ARUKR 24 V series CC1/CC2 OVP + ESD + dead-battery Rd IC, C2876380), R9 (100 kOhm RC0402FR-07100KL pull-up on U6.9 ~{FLT}), C33 (100 nF 50 V X7R GRM155R71H104KE14D on U6.3 VBIAS), and C34 (1 uF 25 V X5R GRM155R61E105KE11J on U6.10 VPWR), and added C21 (100 nF GRM155R71H104KE14D, C77020)"
